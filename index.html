      getDocs, 
      doc,

      deleteDoc,
      query, 
      where, 
      orderBy, 
      onSnapshot,
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDFhEEiLfPnhXUFfFuHlhqXU26sZtEHLFA",

      measurementId: "G-VP8S6PR0Q6"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Make Firebase services accessible globally
    window.firebaseApp = app;
    window.firebaseDb = db;
    window.firebaseAuth = auth;
    window.fbTools = { collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, where, orderBy, onSnapshot, serverTimestamp };

    // Anonymous auth execution
    signInAnonymously(auth)
      .then(() => {
        console.log("Firebase Anonymous Auth Success");
        window.initAppListeners();
      })
      .catch((err) => {
        console.warn("Firebase Auth Warning:", err);
        window.initAppListeners();
      });
  </script>
